id: ADR-009
title: "Knowledge Synthesis Layer — refexplorer Integration and Operator Knowledge Base"
status: PROPOSED
enforcement: ADVISORY
authors: [ry-ops]

context: |
  TAEM's ecosystem layer (ADR-006) stores mission memory, constraint indexes,
  wiring patterns, and lessons learned — all derived from prior missions.
  This is backward-looking knowledge: what this system has done before.

  It has no forward-looking knowledge layer: what the broader field knows
  about the integration domain, what vulnerabilities have been documented,
  what implementation patterns are validated in the literature.

  refexplorer (github.com/levibaruch/refexplorer) provides co-citation graph
  analysis via Semantic Scholar and OpenAlex. Combined with git-steer's repo
  surface capability and eagle-scout's CVE data, TAEM can synthesize:
    - Domain literature summaries
    - Process sequence reviews from real implementations
    - Architecture influence diagrams from co-citation graphs
    - Code review context from reference implementations
    - CVE exposure reviews for specific integration patterns

  This knowledge should persist in Qdrant and Redis so operators do not
  re-derive it on every mission. Operators should be able to annotate and
  correct entries, with annotations weighted in PRB scoring.

decision: |
  Introduce a sixth Qdrant collection: domain_knowledge.
  Introduce a new kernel command: taem knowledge.
  Introduce a new controller: REFEX (github_dispatch, optional, phase 01).
  Knowledge synthesis can be invoked at any phase or standalone.

constraints:
  - id: C-009-001
    rule: "domain_knowledge collection entries must include source, score, domain_tags, and operator_annotations fields"
    enforcement: HARD
    check: "domain_knowledge entries pass schema validation"

  - id: C-009-002
    rule: "REFEX controller is optional — its absence never blocks mission advancement"
    enforcement: HARD
    check: "REFEX signal_type is ADVISORY, not GO | NO-GO"

  - id: C-009-003
    rule: "Redis domain classification cache TTL must not exceed 7 days"
    enforcement: SOFT
    check: "Redis keys for domain_knowledge use TTL <= 604800s"

  - id: C-009-004
    rule: "Semantic Scholar API calls must respect rate limits — 1.1s minimum sleep between requests"
    enforcement: HARD
    check: "refexplorer rate limit config is present and enforced"

  - id: C-009-005
    rule: "Operator annotations are append-only — existing annotations cannot be deleted by automated processes"
    enforcement: HARD
    check: "annotation writes use append semantics, never overwrite"

  - id: C-009-006
    rule: "taem knowledge command must function independently of an active mission"
    enforcement: HARD
    check: "knowledge command does not require TAEM_MC_STATE_PATH to be set"

  - id: C-009-007
    rule: "CVE review output must cross-reference NVD and eagle-scout data, not just literature"
    enforcement: SOFT
    check: "CVE synthesis includes advisory_source field with value NVD | eagle-scout | literature"

outputs:
  - summary: "Structured domain brief — what the field knows about this integration pattern"
  - process_review: "Sequenced step analysis derived from co-citation graph clusters"
  - diagram: "Architecture influence diagram — co-citation network rendered as design decision graph"
  - code_review: "Reference implementation analysis via git-steer repo surface"
  - cve_review: "Vulnerability exposure analysis — literature + NVD + eagle-scout"

new_qdrant_collection:
  name: domain_knowledge
  schema:
    - field: paper_id
    - field: title
    - field: abstract
    - field: domain_tags
    - field: score
    - field: source  # semantic_scholar | openAlex | crossref | operator
    - field: operator_annotations  # append-only array
    - field: advisory_source  # NVD | eagle-scout | literature (for CVE entries)
    - field: created_at
    - field: updated_at

new_redis_keys:
  - pattern: "domain:classification:{task_hash}"
    ttl: 604800  # 7 days
    purpose: "Cache domain classification to skip re-running refexplorer"
  - pattern: "domain:warm:{domain_tag}"
    ttl: 86400   # 1 day
    purpose: "Flag that Qdrant vectors for this domain are warm"

new_cli_command:
  name: "taem knowledge"
  flags:
    - "--task TEXT     Integration task description (required)"
    - "--output TYPE   summary | process | diagram | code | cve | all (default: all)"
    - "--domain TAG    Override domain classification"
    - "--force         Bypass Redis cache, re-run refexplorer"
    - "--annotate      Enter operator annotation mode after synthesis"
  behavior: |
    Functions independently of active missions.
    Checks Redis cache first. On miss, runs refexplorer pipeline.
    Writes results to domain_knowledge Qdrant collection.
    Outputs requested synthesis type to terminal and to outputs/ directory.
